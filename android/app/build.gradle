plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.example.flutter_task"

    // Force compile sdk to 34 (Android 14) to satisfy recent plugin requirements
    compileSdkVersion 34

    // Keep ndkVersion from Flutter settings (if set)
    ndkVersion flutter.ndkVersion

    // Use modern Java compatibility (Java 17)
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Match Kotlin jvmTarget to Java version
    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // Application id - change if you have a custom one
        applicationId "com.example.flutter_task"

        // Keep flutter provided minSdkVersion variable; if you get errors you can set an explicit number (e.g. 21)
        minSdkVersion flutter.minSdkVersion

        // Target SDK should be 34 to match compileSdkVersion
        targetSdkVersion 34

        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            // Using debug signing for now; set proper signing config for production
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {}
